# Pinned ipatool sidecar (https://github.com/majd/ipatool). Format: key=value.
#
# macOS: built from source by fetch-ipatool.sh. Tag v2.7.0 at a pinned commit plus the
# fixes in scripts/ipatool-patches/ (applied in name order), taken from ipatool main,
# which has no release yet. Main also carries large rewrites (store operations via Apple
# frameworks, SAP services moved to macOS 27), so only the fixes are taken, not main.
# Drop the patches once a release includes them.
SOURCE_REPO=https://github.com/majd/ipatool.git
SOURCE_COMMIT=4484b55d366e177ae6c89758c61588712c572fad
GO_VERSION=1.26.5
BUILD_VERSION=2.7.0-restore.1
#
# Windows: official release archive (the Windows build is a check only and never released).
# ARCHIVE_* = sha256 of the release .tar.gz (matches GitHub asset digest).
# BIN_*     = sha256 of the extracted binary inside the archive.
VERSION=2.7.0
ARCHIVE_windows_amd64_NAME=ipatool-2.7.0-windows-amd64.tar.gz
ARCHIVE_windows_amd64_SHA256=b729608716908be287c2e6972f9e8cd05f879810ae5d182fc856c9e57cca0dd5
BIN_windows_amd64_PATH=bin/ipatool-2.7.0-windows-amd64.exe
BIN_windows_amd64_SHA256=7b83589b74ad533f5d5dbab0ca87a5cb76b123bcbeb2553d57e9c154e35d8755
