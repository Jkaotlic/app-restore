# Pinned ipatool sidecar (https://github.com/majd/ipatool). Format: key=value.
#
# macOS: release v2.8.1, built from source without local patches: upstream
# (3e84853e) already carries the fixes we patched 2.7.0/2.8.0 for — delisted
# redownloads, legacy packages and the small-read buffering during cold
# preparation. Recipes change when Apple changes something; bump the pin then.
SOURCE_REPO=https://github.com/majd/ipatool.git
SOURCE_COMMIT=3e84853e2e5d60540a5022b64895d496910144eb
GO_VERSION=1.26.5
BUILD_VERSION=2.8.1-restore.1
#
# Windows: official release archive (the Windows build is a check only and never released).
# ARCHIVE_* = sha256 of the release .tar.gz (matches GitHub asset digest).
# BIN_*     = sha256 of the extracted binary inside the archive.
VERSION=2.8.1
ARCHIVE_windows_amd64_NAME=ipatool-2.8.1-windows-amd64.tar.gz
ARCHIVE_windows_amd64_SHA256=a8ccd8075bc083f99caa49976997860ba5e0e3e8f76b450360cd805262542e97
BIN_windows_amd64_PATH=bin/ipatool-2.8.1-windows-amd64.exe
BIN_windows_amd64_SHA256=1c8145d4b39ff993ebce7cf832d5504ed563cc1526bb21ef5cef27d28aceb2dd
