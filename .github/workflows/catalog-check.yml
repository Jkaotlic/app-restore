name: catalog-check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -m unittest scripts/test_catalog_check.py scripts/test_import_candidates.py

      - name: Check catalog against Apple
        run: python3 scripts/catalog-check.py --write > "$RUNNER_TEMP/report.md"

      - name: Decide what to open
        id: decide
        run: |
          if [ -n "$(git status --porcelain catalog)" ]; then
            echo "pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "pr=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^## (Кандидаты|Неподтверждённые кандидаты|Замаскированные выпуски)' "$RUNNER_TEMP/report.md"; then
            echo "issue=true" >> "$GITHUB_OUTPUT"
          else
            echo "issue=false" >> "$GITHUB_OUTPUT"
          fi
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "body<<$DELIM"
            cat "$RUNNER_TEMP/report.md"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request (never merged automatically)
        if: steps.decide.outputs.pr == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: catalog-check/weekly
          add-paths: catalog/
          commit-message: "chore: weekly catalog check"
          title: "Проверка каталога: изменения за неделю"
          body: ${{ steps.decide.outputs.body }}
          labels: catalog

      # Кандидаты в каталог не вносим сами: человек решает по отчёту. Если файл не менялся,
      # PR не будет, поэтому отчёт идёт в одну и ту же issue (создаётся или обновляется).
      - name: Open or update candidates issue
        if: steps.decide.outputs.pr == 'false' && steps.decide.outputs.issue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Каталог: кандидаты недели"
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
                --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/report.md"
          fi
