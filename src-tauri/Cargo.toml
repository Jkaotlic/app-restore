[package]
name = "app-restore"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_restore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-shell = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["time", "macros", "rt", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
plist = "1"
fs2 = "0.4"
dirs = "6"
idevice = { version = "=0.1.68", features = ["usbmuxd", "afc", "installation_proxy"] }
# Снимки сессий ipatool: Keychain на Mac, Credential Manager на Windows.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.22"
# «Выбрать файл .ipa…»: диалог открывается из Rust, интерфейсу разрешений не нужно.
tauri-plugin-dialog = "2"
# Второй запуск не должен убирать недописанные .part первого: окно одно.
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }
getrandom = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
